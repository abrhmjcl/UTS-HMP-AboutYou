<ion-menu contentId="main-content" type="overlay">

    <ion-header>
        <ion-toolbar color="primary">
            <ion-title>SIMOBILE</ion-title>
        </ion-toolbar>
    </ion-header>
    <ion-content>
        <ion-list>
            <ion-list-header>
                <ion-label>Menu Utama</ion-label>
            </ion-list-header>

            <ion-menu-toggle auto-hide="true">
                <ion-item routerLink="/tabs/dashboard" routerLinkActive="selected" routerDirection="root" lines="none"
                    detail="false">
                    <ion-icon name="home-outline" slot="start"></ion-icon>
                    <ion-label>Dashboard</ion-label>
                </ion-item>
            </ion-menu-toggle>

            <ion-menu-toggle auto-hide="true">
                <ion-item routerLink="/tabs/products" routerLinkActive="selected" routerDirection="root" lines="none"
                    detail="false">
                    <ion-icon name="cube-outline" slot="start"></ion-icon>
                    <ion-label>Produk</ion-label>
                </ion-item>
            </ion-menu-toggle>

            <ion-menu-toggle auto-hide="true">
                <ion-item routerLink="/cart" routerLinkActive="selected" routerDirection="forward" lines="none" detail="false">
                    <ion-icon name="cart-outline" slot="start"></ion-icon>
                    <ion-label>Keranjang</ion-label>
                </ion-item>
              </ion-menu-toggle>
              
              <ion-menu-toggle auto-hide="true">
                <ion-item routerLink="/tabs/transactions" routerLinkActive="selected" routerDirection="root" lines="none" detail="false">
                    <ion-icon name="receipt-outline" slot="start"></ion-icon>
                    <ion-label>Riwayat Transaksi</ion-label>
                </ion-item>
              </ion-menu-toggle>
        </ion-list>

        <ion-list>
            <ion-list-header>
                <ion-label>Lainnya</ion-label>
            </ion-list-header>

            <ion-menu-toggle auto-hide="true">
                <ion-item routerLink="/settings" routerLinkActive="selected" routerDirection="root" lines="none"
                    detail="false">
                    <ion-icon name="settings-outline" slot="start"></ion-icon>
                    <ion-label>Pengaturan</ion-label>
                </ion-item>
            </ion-menu-toggle>

            <ion-menu-toggle auto-hide="true">
                <ion-item routerLink="/about" routerLinkActive="selected" routerDirection="root" lines="none"
                    detail="false">
                    <ion-icon name="information-circle-outline" slot="start"></ion-icon>
                    <ion-label>Tentang Aplikasi</ion-label>
                </ion-item>
            </ion-menu-toggle>

            <ion-menu-toggle auto-hide="true">
                <ion-item (click)="logout()" lines="none" detail="false">
                    <ion-icon name="log-out-outline" slot="start"></ion-icon>
                    <ion-label>Logout</ion-label>
                </ion-item>
            </ion-menu-toggle>
        </ion-list>

    </ion-content>
</ion-menu>

<ion-router-outlet id="main-content"></ion-router-outlet>
