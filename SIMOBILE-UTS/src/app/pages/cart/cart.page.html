<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/products"></ion-back-button>
    </ion-buttons>
    <ion-title>Keranjang</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list *ngIf="cartItems.length > 0; else emptyState">
    <ion-item *ngFor="let item of cartItems; trackBy: trackByItemId" lines="full">
      <ion-thumbnail slot="start">
        <div style="width: 100%; height: 100%; background: #f0f0f0; display: flex; align-items: center; justify-content: center; color: #999;">
          <ion-icon name="image-outline" style="font-size: 24px;"></ion-icon>
        </div>
      </ion-thumbnail>
      <ion-label>
        <h2>{{ item.product.name }}</h2>
        <p>Rp {{ item.product.sellingPrice | number }}</p>
      </ion-label>
      
      <div slot="end" style="display: flex; align-items: center; justify-content: center;">
        <ion-button fill="clear" color="medium" (click)="decreaseQty(item.product.id)">
          <ion-icon name="remove-circle-outline"></ion-icon>
        </ion-button>
        <span style="min-width: 20px; text-align: center;">{{ item.quantity }}</span>
        <ion-button fill="clear" color="primary" (click)="increaseQty(item.product.id)">
          <ion-icon name="add-circle-outline"></ion-icon>
        </ion-button>
      </div>
    </ion-item>
  </ion-list>

  <ng-template #emptyState>
    <div class="ion-text-center ion-padding ion-margin-top">
      <ion-icon name="cart-outline" style="font-size: 4rem; color: #ccc;"></ion-icon>
      <h3 style="color: #666;">Keranjang Kosong</h3>
      <p style="color: #999;">Yuk, belanja dulu!</p>
      <ion-button routerLink="/tabs/products" color="primary" class="ion-margin-top">
        Mulai Belanja
      </ion-button>
    </div>
  </ng-template>

  <ion-toast
    [isOpen]="isToastOpen"
    [message]="toastMessage"
    [duration]="2000"
    color="danger"
    position="top"
    (didDismiss)="isToastOpen = false"
  ></ion-toast>
</ion-content>

<ion-footer *ngIf="cartItems.length > 0">
  <ion-toolbar>
    <ion-title size="small">Total: Rp {{ cartTotal | number }}</ion-title>
    <ion-button slot="end" color="primary" (click)="processCheckout()" class="ion-margin-end">
      Konfirmasi Transaksi
    </ion-button>
  </ion-toolbar>
</ion-footer>
