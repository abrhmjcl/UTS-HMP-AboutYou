<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Keranjang</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div *ngIf="cartItems.length === 0" class="ion-padding ion-text-center">
    <!-- Bisa gunakan <app-empty-state> jika dari Person 4 sudah siap -->
    <ion-icon name="cart-outline" style="font-size: 64px; color: #ccc;"></ion-icon>
    <p>Keranjang masih kosong.</p>
  </div>

  <ion-list *ngIf="cartItems.length > 0">
    <ion-item-sliding *ngFor="let item of cartItems">
      <ion-item>
        <ion-label>
          <h2>{{ item.product.name }}</h2>
          <p>Rp {{ item.product.sellingPrice | number }}</p>
          <p>Subtotal: Rp {{ item.subtotal | number }}</p>
        </ion-label>
        
        <div slot="end" class="qty-controls">
          <ion-button fill="clear" (click)="decreaseQty(item.product.id)">
            <ion-icon name="remove-circle-outline"></ion-icon>
          </ion-button>
          <span>{{ item.quantity }}</span>
          <ion-button fill="clear" (click)="increaseQty(item.product.id)">
            <ion-icon name="add-circle-outline"></ion-icon>
          </ion-button>
        </div>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="removeItem(item.product.id)">
          <ion-icon slot="icon-only" name="trash"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>
</ion-content>

<ion-footer *ngIf="cartItems.length > 0">
  <ion-toolbar>
    <ion-title size="small">Total: Rp {{ cartTotal | number }}</ion-title>
    <ion-button slot="end" color="success" (click)="confirmCheckout()" class="ion-margin-end">
      Checkout
    </ion-button>
  </ion-toolbar>
</ion-footer>
