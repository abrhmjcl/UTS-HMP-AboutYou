<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Profil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding profile-content">
  <div class="profile-header">
    <ion-avatar class="profile-avatar">
      <ion-img [src]="owner.photoUrl" alt="Profile Picture"></ion-img>
    </ion-avatar>
    <h2 class="profile-name">{{ owner.name }}</h2>
    <p class="profile-role">{{ owner.role }}</p>
  </div>
  <ion-card class="info-card">
    <ion-list lines="full">
      <ion-item>
        <ion-icon name="call-outline" slot="start" color="primary"></ion-icon>
        <ion-label>
          <h3>Nomor Telepon</h3>
          <p>{{ owner.phone }}</p>
        </ion-label>
      </ion-item>

      <ion-item>
        <ion-icon name="mail-outline" slot="start" color="primary"></ion-icon>
        <ion-label>
          <h3>Email</h3>
          <p>{{ owner.email }}</p>
        </ion-label>
      </ion-item>

      <ion-item>
        <ion-icon name="location-outline" slot="start" color="primary"></ion-icon>
        <ion-label>
          <h3>Alamat Toko</h3>
          <p class="ion-text-wrap">{{ owner.address }}</p>
        </ion-label>
      </ion-item>

      <ion-item>
        <ion-icon name="calendar-outline" slot="start" color="primary"></ion-icon>
        <ion-label>
          <h3>Bergabung Sejak</h3>
          <p>{{ owner.joinDate }}</p>
        </ion-label>
      </ion-item>
    </ion-list>
  </ion-card>
  <!-- Tambah (click) event di tombol logout -->
<ion-button expand="block" color="danger" class="logout-btn" fill="outline" (click)="logout()">
  <ion-icon name="log-out-outline" slot="start"></ion-icon>
  Keluar / Log Out
</ion-button>
</ion-content>
