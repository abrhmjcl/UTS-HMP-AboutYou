<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Pengaturan</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-list>
    <ion-list-header>
      <ion-label>Tampilan</ion-label>
    </ion-list-header>

    <ion-item>
      <ion-icon name="moon-outline" slot="start"></ion-icon>
      <ion-label>
        <h2>Mode Gelap</h2>
        <p>Aktifkan tema gelap untuk kenyamanan mata</p>
      </ion-label>
      <ion-toggle
        [(ngModel)]="isDarkMode"
        (ionChange)="toggleDarkMode($event)"
        slot="end"
      ></ion-toggle>
    </ion-item>
  </ion-list>

</ion-content>
